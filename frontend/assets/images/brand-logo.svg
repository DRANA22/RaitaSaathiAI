<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    
    <!-- Left Leaf: Vibrant Emerald Gradient -->
    <linearGradient id="rsLeafLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Right Leaf: Golden Sun / Lime AI Glow -->
    <linearGradient id="rsLeafRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Seed / Golden Tech Core -->
    <linearGradient id="rsCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="rsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Glass Edge & Shadow -->
  <rect width="48" height="48" rx="14" fill="url(#rsBgGrad)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="13.25" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  
  <!-- Subtle Internal Tech Orbit -->
  <circle cx="24" cy="24" r="16.5" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" stroke-dasharray="3 4" />

  <!-- Organic Stem -->
  <path d="M24 37 C24 31 23 27 24 20" stroke="#6ee7b7" stroke-width="2.6" stroke-linecap="round" />

  <!-- Left Main Leaf (Agriculture) -->
  <path d="M24 23 C17 23 12 17 13 11 C19 11 24 16 24 23 Z" fill="url(#rsLeafLeft)" filter="url(#rsGlow)" />

  <!-- Right Accent Leaf (AI & Growth) -->
  <path d="M24 20 C24 13 29 9 35 10 C36 16 31 21 24 20 Z" fill="url(#rsLeafRight)" />

  <!-- Golden Central Sprout Node / Seed of Prosperity -->
  <ellipse cx="24" cy="24" rx="3" ry="3.8" fill="url(#rsCoreGrad)" />
  <circle cx="24" cy="24" r="1.3" fill="#ffffff" />

  <!-- Modern AI Sparkle at Leaf Tip -->
  <path d="M35 10 Q35 7 36.5 5.5 Q38 7 38 10 Q38 13 36.5 14.5 Q35 13 35 10 Z" fill="#ffffff" opacity="0.95" />
</svg>